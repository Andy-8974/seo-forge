<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO_FORGE | Premium Utility Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f8fafc', 600: '#4f46e5', 700: '#4338ca', 900: '#0f172a' }
                    },
                    boxShadow: { 'premium': '0 20px 25px -5px rgba(0, 0, 0, 0.05)' }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .code-preview::-webkit-scrollbar { width: 6px; }
        .code-preview::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .tool-section { display: none; }
        .tool-section.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-brand-50 min-h-screen">

    <nav class="glass-nav sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center shadow-lg shadow-brand-600/20">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <span class="text-2xl font-black text-brand-900 tracking-tighter uppercase">SEO_FORGE</span>
            </div>
            <div class="hidden md:flex items-center space-x-6">
                <button onclick="showTool('schema-tool', this)" class="nav-link text-sm font-bold text-brand-600 border-b-2 border-brand-600 pb-1">Schema Gen</button>
                <button onclick="showTool('slug-tool', this)" class="nav-link text-sm font-bold text-slate-400 hover:text-brand-600 pb-1">Slug Opt</button>
                <button onclick="showTool('list-tool', this)" class="nav-link text-sm font-bold text-slate-400 hover:text-brand-600 pb-1">List Cleaner</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-12 grid grid-cols-1 lg:grid-cols-12 gap-10">
        
        <div class="lg:col-span-7">
            
            <section id="schema-tool" class="tool-section active space-y-8">
                <div class="bg-white rounded-[2rem] p-8 shadow-premium border border-slate-200/60">
                    <h1 class="text-3xl font-black text-slate-900 mb-2">FAQ Schema Generator</h1>
                    <p class="text-slate-500 mb-8">Generate JSON-LD for Google Rich Snippets.</p>
                    <div id="faq-rows" class="space-y-4"></div>
                    <button onclick="addFaqItem()" class="w-full mt-6 py-4 border-2 border-dashed border-slate-200 rounded-2xl text-slate-400 font-bold hover:border-brand-600 hover:text-brand-600 transition">+ Add Question</button>
                </div>
            </section>

            <section id="slug-tool" class="tool-section space-y-8">
                <div class="bg-white rounded-[2rem] p-8 shadow-premium border border-slate-200/60">
                    <h1 class="text-3xl font-black text-slate-900 mb-2">SEO Slug Optimizer</h1>
                    <p class="text-slate-500 mb-8">Create clean, stop-word-free URL structures.</p>
                    <input type="text" id="slugInput" oninput="runSlug()" class="w-full p-4 bg-slate-50 border rounded-xl outline-none focus:border-brand-600" placeholder="Enter Page Title...">
                </div>
            </section>

            <section id="list-tool" class="tool-section space-y-8">
                <div class="bg-white rounded-[2rem] p-8 shadow-premium border border-slate-200/60">
                    <h1 class="text-3xl font-black text-slate-900 mb-2">Pro List Cleaner</h1>
                    <p class="text-slate-500 mb-8">De-duplicate and alphabetize your data.</p>
                    <textarea id="listInput" oninput="runList()" class="w-full h-64 p-4 bg-slate-50 border rounded-xl outline-none focus:border-brand-600 font-mono text-sm" placeholder="Paste list items here..."></textarea>
                    <div class="flex gap-4 mt-4">
                        <label class="flex items-center gap-2 text-sm font-bold text-slate-600"><input type="checkbox" id="cleanDupe" checked onchange="runList()"> Remove Duplicates</label>
                        <label class="flex items-center gap-2 text-sm font-bold text-slate-600"><input type="checkbox" id="cleanSort" checked onchange="runList()"> Sort A-Z</label>
                    </div>
                </div>
            </section>

        </div>

        <aside class="lg:col-span-5 space-y-8">
            <div class="bg-brand-900 rounded-[2.5rem] p-8 shadow-2xl sticky top-28">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-brand-600 font-black text-[10px] uppercase tracking-widest">Live Output</span>
                    <button onclick="copyOutput()" class="bg-brand-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold hover:bg-brand-500 transition">Copy</button>
                </div>
                <textarea id="masterOutput" readonly class="code-preview w-full h-[350px] bg-slate-800/50 text-emerald-400 font-mono text-[11px] p-6 rounded-2xl border border-slate-700/50 outline-none resize-none"></textarea>
            </div>
            
            <div class="bg-white p-6 rounded-[2rem] border border-slate-200 text-center shadow-premium">
                <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest block mb-4">Advertisement</span>
                <div class="aspect-[4/3] bg-slate-50 border border-dashed rounded-2xl flex items-center justify-center text-slate-300 italic">AdSense Unit</div>
            </div>
        </aside>
    </main>

    <script>
        // TAB SWITCHER
        function showTool(toolId, btn) {
            document.querySelectorAll('.tool-section').forEach(s => s.classList.remove('active'));
            document.getElementById(toolId).classList.add('active');
            document.querySelectorAll('.nav-link').forEach(l => {
                l.classList.remove('text-brand-600', 'border-b-2', 'border-brand-600');
                l.classList.add('text-slate-400');
            });
            btn.classList.add('text-brand-600', 'border-b-2', 'border-brand-600');
            btn.classList.remove('text-slate-400');
            updateOutputs();
        }

        // TOOL 1: SCHEMA LOGIC
        let faqs = [{ q: "What is SEO Forge?", a: "A premium suite of client-side SEO tools." }];
        function renderFaqs() {
            const container = document.getElementById('faq-rows');
            container.innerHTML = faqs.map((f, i) => `
                <div class="p-4 bg-slate-50 rounded-xl border space-y-2">
                    <input type="text" oninput="updateFaq(${i},'q',this.value)" value="${f.q}" class="w-full p-2 rounded border text-sm font-bold" placeholder="Question">
                    <textarea oninput="updateFaq(${i},'a',this.value)" class="w-full p-2 rounded border text-sm" placeholder="Answer">${f.a}</textarea>
                </div>
            `).join('');
            updateOutputs();
        }
        function updateFaq(i, k, v) { faqs[i][k] = v; updateOutputs(); }
        function addFaqItem() { faqs.push({ q: "", a: "" }); renderFaqs(); }

        // TOOL 2: SLUG LOGIC
        function runSlug() {
            const input = document.getElementById('slugInput').value;
            const stopWords = /\b(a|an|the|and|or|but|is|if|then|else|at|by|for|with|in|on|to)\b/gi;
            const slug = input.toLowerCase().replace(stopWords, '').replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-').replace(/-+/g, '-');
            document.getElementById('masterOutput').value = slug;
        }

        // TOOL 3: LIST LOGIC
        function runList() {
            const input = document.getElementById('listInput').value;
            let list = input.split('\n').map(i => i.trim()).filter(i => i !== "");
            if (document.getElementById('cleanDupe').checked) list = [...new Set(list)];
            if (document.getElementById('cleanSort').checked) list.sort();
            document.getElementById('masterOutput').value = list.join('\n');
        }

        // OUTPUT DISPATCHER
        function updateOutputs() {
            const activeTool = document.querySelector('.tool-section.active').id;
            if (activeTool === 'schema-tool') {
                const schema = { "@context": "https://schema.org", "@type": "FAQPage", "mainEntity": faqs.filter(f => f.q && f.a).map(f => ({ "@type": "Question", "name": f.q, "acceptedAnswer": { "@type": "Answer", "text": f.a } })) };
                document.getElementById('masterOutput').value = JSON.stringify(schema, null, 2);
            } else if (activeTool === 'slug-tool') {
                runSlug();
            } else if (activeTool === 'list-tool') {
                runList();
            }
        }

        async function copyOutput() {
            await navigator.clipboard.writeText(document.getElementById('masterOutput').value);
            alert('Copied!');
        }

        // Start
        renderFaqs();
    </script>
</body>
</html>
