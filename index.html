<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO_FORGE | Advanced Schema & Text Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { 50: '#f8fafc', 600: '#4f46e5', 700: '#4338ca', 900: '#0f172a' } },
                    boxShadow: { 'premium': '0 20px 25px -5px rgba(0, 0, 0, 0.05)' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .tool-section { display: none; }
        .tool-section.active { display: block; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-brand-50 min-h-screen pb-20">

    <nav class="glass-nav sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center shadow-lg shadow-brand-600/20 text-white font-bold">SF</div>
                <span class="text-2xl font-black text-brand-900 tracking-tighter uppercase">SEO_FORGE</span>
            </div>
            <div class="hidden md:flex items-center space-x-4 text-xs font-bold uppercase tracking-widest text-slate-400">
                <button onclick="showTool('schema-faq', this)" class="nav-link text-brand-600 border-b-2 border-brand-600 pb-1">FAQ</button>
                <button onclick="showTool('schema-product', this)" class="nav-link hover:text-brand-600 transition">Product</button>
                <button onclick="showTool('schema-howto', this)" class="nav-link hover:text-brand-600 transition">How-To</button>
                <div class="w-px h-4 bg-slate-200"></div>
                <button onclick="showTool('slug-opt', this)" class="nav-link hover:text-brand-600 transition">Slug</button>
                <button onclick="showTool('list-clean', this)" class="nav-link hover:text-brand-600 transition">List</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-12 grid grid-cols-1 lg:grid-cols-12 gap-10">
        
        <div class="lg:col-span-7">
            
            <section id="schema-faq" class="tool-section active">
                <div class="bg-white rounded-3xl p-8 shadow-premium border border-slate-200/60">
                    <h1 class="text-2xl font-black mb-6">FAQ Schema Generator</h1>
                    <div id="faq-rows" class="space-y-4"></div>
                    <button onclick="addItem('faq')" class="w-full mt-4 py-3 border-2 border-dashed border-slate-200 rounded-xl text-slate-400 font-bold hover:text-brand-600 transition">+ Add Item</button>
                </div>
            </section>

            <section id="schema-product" class="tool-section">
                <div class="bg-white rounded-3xl p-8 shadow-premium border border-slate-200/60 space-y-4">
                    <h1 class="text-2xl font-black mb-6 text-emerald-600">Product Schema Generator</h1>
                    <input type="text" id="prodName" oninput="runProd()" placeholder="Product Name" class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                    <input type="text" id="prodPrice" oninput="runProd()" placeholder="Price (e.g. 29.99)" class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                    <input type="text" id="prodCurrency" oninput="runProd()" placeholder="Currency (e.g. USD)" value="USD" class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                    <select id="prodAvail" onchange="runProd()" class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                        <option value="InStock">In Stock</option>
                        <option value="OutOfStock">Out of Stock</option>
                    </select>
                </div>
            </section>

            <section id="schema-howto" class="tool-section">
                <div class="bg-white rounded-3xl p-8 shadow-premium border border-slate-200/60">
                    <h1 class="text-2xl font-black mb-6 text-orange-500">How-To Schema Generator</h1>
                    <input type="text" id="htName" oninput="runHowTo()" placeholder="How to..." class="w-full p-3 bg-slate-50 border rounded-xl outline-none mb-4">
                    <div id="ht-rows" class="space-y-4"></div>
                    <button onclick="addItem('howto')" class="w-full mt-4 py-3 border-2 border-dashed border-slate-200 rounded-xl text-slate-400 font-bold hover:text-orange-500 transition">+ Add Step</button>
                </div>
            </section>

            <section id="slug-opt" class="tool-section">
                <div class="bg-white rounded-3xl p-8 shadow-premium border border-slate-200/60">
                    <h1 class="text-2xl font-black mb-6">Slug Optimizer</h1>
                    <input type="text" id="slugIn" oninput="runSlug()" placeholder="Enter page title..." class="w-full p-4 bg-slate-50 border rounded-xl outline-none">
                </div>
            </section>

            <section id="list-clean" class="tool-section">
                <div class="bg-white rounded-3xl p-8 shadow-premium border border-slate-200/60">
                    <h1 class="text-2xl font-black mb-6">List Cleaner</h1>
                    <textarea id="listIn" oninput="runList()" class="w-full h-64 p-4 bg-slate-50 border rounded-xl outline-none font-mono text-sm" placeholder="Paste list..."></textarea>
                </div>
            </section>
        </div>

        <aside class="lg:col-span-5 space-y-6">
            <div class="bg-brand-900 rounded-[2rem] p-8 shadow-2xl sticky top-28">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-brand-600 font-black text-xs uppercase tracking-widest">JSON-LD Output</span>
                    <div class="flex gap-2">
                        <button onclick="copyOut()" class="bg-brand-600 text-white px-3 py-1 rounded text-[10px] font-bold">Copy</button>
                        <a href="https://search.google.com/test/rich-results" target="_blank" class="bg-slate-700 text-white px-3 py-1 rounded text-[10px] font-bold hover:bg-slate-600">Test on Google</a>
                    </div>
                </div>
                <textarea id="out" readonly class="w-full h-[400px] bg-transparent text-emerald-400 font-mono text-[10px] p-2 outline-none resize-none"></textarea>
            </div>
            <div class="p-6 bg-white rounded-3xl border border-dashed border-slate-200 text-center text-slate-300 text-xs italic">AdSense Display Unit</div>
        </aside>
    </main>

    <script>
        let faqs = [{q:"What is SEO Forge?", a:"A high-speed SEO toolkit."}];
        let howtos = [{s:"Start by entering your first step."}];

        function showTool(id, btn) {
            document.querySelectorAll('.tool-section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('text-brand-600','border-b-2','border-brand-600'));
            btn.classList.add('text-brand-600','border-b-2','border-brand-600');
            update();
        }

        function addItem(type) {
            if(type==='faq') faqs.push({q:"",a:""});
            else howtos.push({s:""});
            render();
        }

        function updateField(type, i, k, v) {
            if(type==='faq') faqs[i][k] = v;
            else howtos[i].s = v;
            update();
        }

        function render() {
            document.getElementById('faq-rows').innerHTML = faqs.map((f,i)=>`<div class="space-y-2 p-3 bg-slate-50 rounded-xl border"><input oninput="updateField('faq',${i},'q',this.value)" value="${f.q}" class="w-full p-2 text-xs font-bold" placeholder="Question"><textarea oninput="updateField('faq',${i},'a',this.value)" class="w-full p-2 text-xs border rounded" placeholder="Answer">${f.a}</textarea></div>`).join('');
            document.getElementById('ht-rows').innerHTML = howtos.map((h,i)=>`<div class="flex gap-2"><span class="font-bold text-slate-300">${i+1}.</span><input oninput="updateField('ht',${i},'s',this.value)" value="${h.s}" class="w-full p-2 text-xs border rounded-lg" placeholder="Step description"></div>`).join('');
            update();
        }

        function update() {
            const active = document.querySelector('.tool-section.active').id;
            let res = "";
            if(active==='schema-faq') res = JSON.stringify({"@context":"https://schema.org","@type":"FAQPage","mainEntity":faqs.map(f=>({"@type":"Question","name":f.q,"acceptedAnswer":{"@type":"Answer","text":f.a}}))},null,2);
            else if(active==='schema-product') res = JSON.stringify({"@context":"https://schema.org","@type":"Product","name":document.getElementById('prodName').value,"offers":{"@type":"Offer","price":document.getElementById('prodPrice').value,"priceCurrency":document.getElementById('prodCurrency').value,"availability":"https://schema.org/"+document.getElementById('prodAvail').value}},null,2);
            else if(active==='schema-howto') res = JSON.stringify({"@context":"https://schema.org","@type":"HowTo","name":document.getElementById('htName').value,"step":howtos.map(h=>({"@type":"HowToStep","text":h.s}))},null,2);
            else if(active==='slug-opt') { const sw = /\b(a|an|the|and|or|but|is|at|by|for|with|in|on|to)\b/gi; res = document.getElementById('slugIn').value.toLowerCase().replace(sw,'').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').replace(/-+/g,'-'); }
            else if(active==='list-clean') res = [...new Set(document.getElementById('listIn').value.split('\n').map(i=>i.trim()).filter(i=>i!==""))].sort().join('\n');
            document.getElementById('out').value = res;
        }

        function runProd() { update(); }
        function runHowTo() { update(); }
        function runSlug() { update(); }
        function runList() { update(); }
        async function copyOut() { await navigator.clipboard.writeText(document.getElementById('out').value); alert('Copied!'); }

        render();
    </script>
</body>
</html>
