<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO_FORGE | Professional SEO Tool Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfdfe; }
        .glass-card { background: white; border: 1px solid #f1f5f9; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05); border-radius: 20px; }
    </style>
</head>
<body>

    <nav class="flex items-center justify-between px-10 py-6 bg-white border-b sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center text-white font-bold">SF</div>
            <span class="text-xl font-extrabold text-slate-900">SEO_FORGE</span>
        </div>
        <div class="hidden md:flex gap-8 text-sm font-bold text-slate-500 uppercase tracking-widest">
            <button onclick="switchTool('schema')">Schema</button>
            <button onclick="switchTool('roi')">ROI Calc</button>
            <button onclick="switchTool('meta')">Meta Gen</button>
        </div>
        <button class="bg-orange-500 text-white px-6 py-2 rounded-xl font-bold text-sm shadow-lg shadow-orange-100">Contact</button>
    </nav>

    <section class="text-center py-20 bg-gradient-to-b from-blue-50/50 to-transparent">
        <h1 class="text-5xl font-extrabold text-slate-900 mb-4">Professional <span class="text-orange-500">SEO Tools</span></h1>
        <p class="text-slate-500 max-w-2xl mx-auto text-lg mb-10">Instant, browser-side utilities for modern digital marketers. No data collection, no login, just results.</p>
    </section>

    <main class="max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-2 gap-10 mb-20">
        
        <div id="input-container" class="glass-card p-8">
            <div id="roi-tool" class="tool-view hidden">
                <h2 class="text-2xl font-bold mb-6">Ads ROI Calculator</h2>
                <div class="space-y-4">
                    <label class="block text-xs font-bold text-slate-400 uppercase">Monthly Budget ($)</label>
                    <input type="number" id="roiBudget" oninput="calcROI()" class="w-full p-4 bg-slate-50 border rounded-xl" value="1000">
                    <label class="block text-xs font-bold text-slate-400 uppercase">Expected Conversion Rate (%)</label>
                    <input type="number" id="roiConv" oninput="calcROI()" class="w-full p-4 bg-slate-50 border rounded-xl" value="2.5">
                    <label class="block text-xs font-bold text-slate-400 uppercase">Avg. Sale Value ($)</label>
                    <input type="number" id="roiSale" oninput="calcROI()" class="w-full p-4 bg-slate-50 border rounded-xl" value="100">
                </div>
            </div>

            <div id="schema-tool" class="tool-view active">
                <h2 class="text-2xl font-bold mb-6">Organization Schema</h2>
                <input type="text" id="bizName" oninput="update()" placeholder="Business Name" class="w-full p-4 bg-slate-50 border rounded-xl mb-4">
                <input type="text" id="bizUrl" oninput="update()" placeholder="Website URL" class="w-full p-4 bg-slate-50 border rounded-xl">
            </div>
        </div>

        <div class="glass-card bg-slate-900 p-8 text-white">
            <div class="flex justify-between items-center mb-6">
                <span class="text-xs font-black text-orange-500 uppercase tracking-widest">Live Result</span>
                <button onclick="copyCode()" class="bg-white/10 px-4 py-1 rounded text-xs font-bold hover:bg-white/20 transition">Copy</button>
            </div>
            <textarea id="output" readonly class="w-full h-80 bg-transparent text-emerald-400 font-mono text-xs outline-none resize-none leading-relaxed"></textarea>
        </div>
    </main>

    <section class="max-w-7xl mx-auto px-6 py-20 border-t">
        <h3 class="text-2xl font-bold text-center mb-12">More Free Tools</h3>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="p-8 bg-white border rounded-2xl text-center hover:shadow-xl transition cursor-pointer" onclick="switchTool('meta')">
                <div class="text-orange-500 font-bold mb-2">Meta</div>
                <div class="font-bold">Tag Generator</div>
            </div>
            <div class="p-8 bg-white border rounded-2xl text-center hover:shadow-xl transition">
                <div class="text-blue-500 font-bold mb-2">UTM</div>
                <div class="font-bold">Link Builder</div>
            </div>
            <div class="p-8 bg-white border rounded-2xl text-center hover:shadow-xl transition">
                <div class="text-emerald-500 font-bold mb-2">QR</div>
                <div class="font-bold">Code Generator</div>
            </div>
            <div class="p-8 bg-white border rounded-2xl text-center hover:shadow-xl transition">
                <div class="text-purple-500 font-bold mb-2">Robots</div>
                <div class="font-bold">TXT Generator</div>
            </div>
        </div>
    </section>

    <script>
        function switchTool(type) {
            document.querySelectorAll('.tool-view').forEach(v => v.classList.add('hidden'));
            document.getElementById(type + '-tool').classList.remove('hidden');
            document.getElementById(type + '-tool').classList.add('active');
            update();
        }

        function update() {
            const active = document.querySelector('.tool-view.active').id;
            let res = "";
            if(active === 'roi-tool') calcROI();
            else if(active === 'schema-tool') {
                res = JSON.stringify({"@context":"https://schema.org","@type":"Organization","name":document.getElementById('bizName').value,"url":document.getElementById('bizUrl').value},null,4);
                document.getElementById('output').value = res;
            }
        }

        function calcROI() {
            const budget = document.getElementById('roiBudget').value;
            const conv = document.getElementById('roiConv').value / 100;
            const sale = document.getElementById('roiSale').value;
            const cpc = 1.50; // Assume average CPC
            const clicks = budget / cpc;
            const conversions = clicks * conv;
            const revenue = conversions * sale;
            const profit = revenue - budget;
            
            document.getElementById('output').value = `ESTIMATED MONTHLY RESULTS:\n\nClicks: ${Math.round(clicks)}\nConversions: ${Math.round(conversions)}\nGross Revenue: $${revenue.toFixed(2)}\nNet Profit: $${profit.toFixed(2)}\n\nROI: ${((profit/budget)*100).toFixed(2)}%`;
        }

        async function copyCode() {
            await navigator.clipboard.writeText(document.getElementById('output').value);
            alert('Copied!');
        }

        update();
    </script>
</body>
</html>
