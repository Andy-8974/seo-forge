<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO_FORGE Pro | Advanced Schema Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { brand: { 50: '#f4f7ff', 600: '#3b82f6', 700: '#2563eb', 900: '#0f172a' } }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .tool-content { display: none; }
        .tool-content.active { display: block; }
        .nav-btn.active { background: #eff6ff; color: #2563eb; border-right: 3px solid #2563eb; }
    </style>
</head>
<body class="bg-white flex flex-col">

    <header class="h-16 border-b flex items-center justify-between px-6 bg-white shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-brand-700 rounded-lg flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-blue-200">S</div>
            <span class="font-extrabold text-brand-900 tracking-tight">SEO_FORGE <span class="text-blue-600">PRO</span></span>
        </div>
        <div class="flex gap-4">
            <a href="https://search.google.com/test/rich-results" target="_blank" class="text-xs font-bold text-slate-500 hover:text-brand-700 transition uppercase tracking-widest">Google Validator</a>
            <button onclick="copyOut()" class="bg-brand-700 text-white px-5 py-2 rounded-full text-xs font-bold shadow-md hover:scale-105 transition">Copy JSON-LD</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="w-64 border-r bg-slate-50 flex flex-col shrink-0 custom-scrollbar overflow-y-auto">
            <div class="p-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Select Schema Type</div>
            <nav class="flex flex-col">
                <button onclick="switchTab('faq', this)" class="nav-btn active flex items-center gap-3 px-6 py-4 text-sm font-semibold text-slate-600 hover:bg-slate-100 transition text-left">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg> FAQ Page
                </button>
                <button onclick="switchTab('local', this)" class="nav-btn flex items-center gap-3 px-6 py-4 text-sm font-semibold text-slate-600 hover:bg-slate-100 transition text-left">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg> Local Business
                </button>
                <button onclick="switchTab('product', this)" class="nav-btn flex items-center gap-3 px-6 py-4 text-sm font-semibold text-slate-600 hover:bg-slate-100 transition text-left">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg> Product
                </button>
                <button onclick="switchTab('howto', this)" class="nav-btn flex items-center gap-3 px-6 py-4 text-sm font-semibold text-slate-600 hover:bg-slate-100 transition text-left">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg> How-To
                </button>
            </nav>
            
            <div class="mt-auto p-4">
                <div class="aspect-square bg-white border border-dashed rounded-xl flex items-center justify-center text-[10px] text-slate-300 italic p-4 text-center">
                    Ad Unit Sidebar
                </div>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto custom-scrollbar p-10 bg-white">
            <div class="max-w-2xl mx-auto">
                
                <div id="faq" class="tool-content active">
                    <h2 class="text-2xl font-extrabold text-slate-900 mb-2">FAQ Schema</h2>
                    <p class="text-sm text-slate-500 mb-8">Add frequently asked questions to your page.</p>
                    <div id="faq-list" class="space-y-4"></div>
                    <button onclick="addFaq()" class="mt-6 w-full py-3 border-2 border-dashed border-slate-200 rounded-xl text-slate-400 font-bold hover:border-blue-400 hover:text-blue-600 transition">
                        + Add Question
                    </button>
                </div>

                <div id="local" class="tool-content">
                    <h2 class="text-2xl font-extrabold text-slate-900 mb-8">Local Business</h2>
                    <div class="space-y-4">
                        <input type="text" id="loc-name" oninput="update()" placeholder="Business Name" class="w-full p-4 bg-slate-50 border rounded-xl outline-none focus:ring-2 ring-blue-100">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="loc-phone" oninput="update()" placeholder="Phone Number" class="w-full p-4 bg-slate-50 border rounded-xl outline-none">
                            <input type="text" id="loc-url" oninput="update()" placeholder="Website URL" class="w-full p-4 bg-slate-50 border rounded-xl outline-none">
                        </div>
                    </div>
                </div>

                <div id="product" class="tool-content">
                    <h2 class="text-2xl font-extrabold text-slate-900 mb-8">Product Details</h2>
                    <div class="space-y-4">
                        <input type="text" id="prod-name" oninput="update()" placeholder="Product Name" class="w-full p-4 bg-slate-50 border rounded-xl outline-none">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="prod-price" oninput="update()" placeholder="Price (29.99)" class="w-full p-4 bg-slate-50 border rounded-xl outline-none">
                            <input type="text" id="prod-sku" oninput="update()" placeholder="SKU / ID" class="w-full p-4 bg-slate-50 border rounded-xl outline-none">
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <aside class="w-[450px] border-l bg-slate-900 flex flex-col shrink-0">
            <div class="h-12 flex items-center justify-between px-6 border-b border-slate-800 shrink-0">
                <span class="text-[10px] font-black text-slate-500 uppercase tracking-[0.3em]">JSON-LD Preview</span>
                <span class="text-[10px] text-emerald-500 font-mono">● VALIDATED</span>
            </div>
            <textarea id="output" readonly class="flex-1 bg-transparent text-emerald-400 font-mono text-[11px] p-8 outline-none resize-none custom-scrollbar leading-relaxed"></textarea>
        </aside>

    </div>

    <script>
        let faqs = [{q: "Example Question?", a: "This is an example answer."}];

        function switchTab(id, btn) {
            document.querySelectorAll('.tool-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            update();
        }

        function addFaq() { faqs.push({q:'', a:''}); renderFaqs(); }
        
        function renderFaqs() {
            const container = document.getElementById('faq-list');
            container.innerHTML = faqs.map((f, i) => `
                <div class="p-6 bg-slate-50 rounded-2xl border border-slate-100 space-y-3">
                    <input type="text" value="${f.q}" oninput="faqs[${i}].q = this.value; update()" class="w-full p-3 bg-white border rounded-lg text-sm" placeholder="Question">
                    <textarea oninput="faqs[${i}].a = this.value; update()" class="w-full p-3 bg-white border rounded-lg text-sm h-20" placeholder="Answer">${f.a}</textarea>
                </div>
            `).join('');
            update();
        }

        function update() {
            const activeId = document.querySelector('.tool-content.active').id;
            let json = {};

            if(activeId === 'faq') {
                json = { "@context": "https://schema.org", "@type": "FAQPage", "mainEntity": faqs.map(f => ({ "@type": "Question", "name": f.q, "acceptedAnswer": { "@type": "Answer", "text": f.a } })) };
            } else if(activeId === 'local') {
                json = { "@context": "https://schema.org", "@type": "LocalBusiness", "name": document.getElementById('loc-name').value, "telephone": document.getElementById('loc-phone').value, "url": document.getElementById('loc-url').value };
            } else if(activeId === 'product') {
                json = { "@context": "https://schema.org", "@type": "Product", "name": document.getElementById('prod-name').value, "offers": { "@type": "Offer", "price": document.getElementById('prod-price').value, "sku": document.getElementById('prod-sku').value } };
            }

            document.getElementById('output').value = JSON.stringify(json, null, 4);
        }

        async function copyOut() {
            await navigator.clipboard.writeText(document.getElementById('output').value);
            alert('Copied to Clipboard');
        }

        renderFaqs();
    </script>
</body>
</html>
